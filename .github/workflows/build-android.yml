name: Build HGhub v1.2.1 Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout HGhub v1.2.1
        uses: actions/checkout@v4
        with:
          repository: Minireel/HGhub
          ref: v1.2.1
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override v3's obsolete default: tools platform-tools.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      - name: Build debug ARM64 APK
        run: pnpm tauri android build --debug --apk --target aarch64

      - name: Verify APK architecture and signature
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-debug.apk' -print0)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No debug APK was generated"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
            cat "$RUNNER_TEMP/apk-badging.txt"
            grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-v1.2.1-Android-ARM64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*-debug.apk
          if-no-files-found: error
          retention-days: 30
